name: Did You Android checks
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-check.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-check.yml'
jobs:
  validate:
    name: Validate Android bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-fund --no-audit
      - run: npx expo-doctor
      - run: npx expo export --platform android --output-dir ./dist-check
